# The whole system, top to bottom. Run: ansible-playbook site.yml
- name: Base configuration for every server
  hosts: all
  become: true
  roles:
    - common

- name: Database server
  hosts: databases
  become: true
  roles:
    - postgresql
    - redis

# serial: 1 = rolling update. One app server at a time is changed and must
# pass its readiness check before the next one is touched, so the load
# balancer always has a healthy server to send traffic to.
- name: Application servers
  hosts: appservers
  become: true
  serial: 1
  roles:
    - app

- name: Load balancer
  hosts: loadbalancers
  become: true
  roles:
    - nginx

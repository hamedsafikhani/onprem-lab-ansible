# Which servers exist and which group each one belongs to.
# Groups describe roles, not machines: a playbook targets "appservers",
# so adding app3 later means adding one line here.
all:
  vars:
    ansible_user: vagrant
    ansible_host: "{{ service_ip }}"
    ansible_ssh_private_key_file: "{{ inventory_dir }}/../../.vagrant/machines/{{ inventory_hostname }}/libvirt/private_key"
  children:
    loadbalancers:
      hosts:
        lb:
          service_ip: 192.168.60.10
    appservers:
      hosts:
        app1:
          service_ip: 192.168.60.21
        app2:
          service_ip: 192.168.60.22
    databases:
      hosts:
        db:
          service_ip: 192.168.60.30

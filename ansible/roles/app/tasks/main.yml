- name: Install Python virtualenv support
  ansible.builtin.apt:
    name: python3-venv
    state: present

- name: Create system user for the app (no login shell)
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_home }}"
    create_home: false

- name: Create app directory (owned by root, the app only reads it)
  ansible.builtin.file:
    path: "{{ app_home }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy application code
  ansible.builtin.copy:
    src: "{{ app_src_dir }}/"
    dest: "{{ app_home }}/app/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  notify: Restart todo

- name: Install Python dependencies into the virtualenv
  ansible.builtin.pip:
    requirements: "{{ app_home }}/app/requirements.txt"
    virtualenv: "{{ app_home }}/venv"
    virtualenv_command: python3 -m venv
  notify: Restart todo

- name: Create config directory (root writes, app group reads)
  ansible.builtin.file:
    path: "{{ app_config_dir }}"
    state: directory
    owner: root
    group: "{{ app_user }}"
    mode: "0750"

- name: Write environment file (contains passwords)
  ansible.builtin.template:
    src: todo.env.j2
    dest: "{{ app_config_dir }}/todo.env"
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  diff: false
  notify: Restart todo

- name: Install systemd unit
  ansible.builtin.template:
    src: todo.service.j2
    dest: /etc/systemd/system/todo.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart todo

- name: Make sure the app is running and starts on boot
  ansible.builtin.systemd_service:
    name: todo
    state: started
    enabled: true
    daemon_reload: true

# Run the restart now (if anything changed), not at the end of the play,
# so the check below tests the new version.
- name: Apply pending restart
  ansible.builtin.meta: flush_handlers

- name: Wait until the app reports ready
  ansible.builtin.uri:
    url: "http://{{ app_listen_ip }}:{{ app_port }}/health/ready"
    status_code: 200
  register: app_ready
  until: app_ready.status == 200
  retries: 15
  delay: 2

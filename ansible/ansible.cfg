# Ansible reads this file only when you run ansible from THIS directory.
[defaults]
inventory = inventory/hosts.yml
vault_password_file = ~/.ansible/todo-vault-pass
# Lab only: VMs are recreated often and get new SSH host keys each time.
# In production keep this True so a changed host key is noticed.
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
# Lab only: do not store lab host keys in ~/.ssh/known_hosts at all.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
